name: Blog – napsat článek

# Každé ráno vezme z content/blog/_fronta.json nejbližší schválené téma, které
# vychází v příštích 4 dnech a ještě není napsané ani v PR (jinak nic nedělá).
# Denní běh je pojistka: GitHub plánovaný běh občas vynechá (24. 11. 2026),
# další den téma dožene. Autor (skill blog-clanek) ho napíše podle briefu
# konkurence z workspace, redaktor (agent blog-editor) ověří fakta, opraví
# drobnosti a vydá verdikt. Když článek vrátí, autor ho jednou přepracuje podle
# posudku a redaktor ho čte znovu. Při SCHVÁLENO a BLOG_AUTOMERGE=true se PR
# sloučí sám (autopilot), jinak zůstane otevřený a článek nevyjde. Na webu se
# článek objeví až v termínu (publishAt), náhled PR na Vercelu ho ukazuje hned.
# Ručně: Actions → Blog – napsat článek → Run workflow (volitelně slug).
#
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (nebo ANTHROPIC_API_KEY), WORKSPACE_SSH_KEY.
# Proměnná BLOG_AUTOMERGE (true = autopilot). Actions musí smět vytvářet PR.

on:
  schedule:
    # 6:23 / 7:23 Praha, mimo celou hodinu, kdy GitHub běhy nejčastěji zahazuje.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug tématu z fronty (prázdné = další na řadě)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: blog-write
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TOOLS: "Read,Write,Edit,MultiEdit,Glob,Grep,WebSearch,WebFetch,Bash(npm run blog:check*),Bash(node scripts/blog-check.mjs*),Bash(npm run blog:queue*),Bash(node scripts/blog-queue.mjs*)"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Vybrat téma
        id: next
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          if [ -n "$SLUG" ]; then
            node scripts/blog-queue.mjs next --id "$SLUG"
          else
            node scripts/blog-queue.mjs next --within 4
          fi

      - name: Workspace agentů
        if: steps.next.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: sobotkakrystof5-png/vizeon-seo-workspace
          ssh-key: ${{ secrets.WORKSPACE_SSH_KEY }}
          path: workspace

      - name: Autor – napsat článek
        if: steps.next.outputs.found == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Napiš článek na blog vizeon.cz přesně podle skillu blog-clanek
            (.claude/skills/blog-clanek/SKILL.md).

            Téma je položka se slugem "${{ steps.next.outputs.slug }}" v content/blog/_fronta.json
            (hlavní klíčové slovo "${{ steps.next.outputs.keyword }}", vychází ${{ steps.next.outputs.publishAt }}).
            Brief konkurence: workspace/serp/${{ steps.next.outputs.slug }}.md (když existuje).
            Článek musí pokrýt vše, co má první trojka, a využít mezery z briefu.

            - Ulož článek do content/blog/${{ steps.next.outputs.slug }}.mdx.
            - Fakta ber jen z content/blog/_fakta.md, datových souborů webu a ověřených zdrojů s odkazem.
            - Doplň odkaz na nový článek do 1–2 starších souvisejících článků.
            - Ve frontě nastav status položky na "napsano".
            - Spusť `npm run blog:check` a oprav všechny chyby, dokud neprojde.
            - Měň jen soubory v content/blog/. Necommituj, PR vytvoří workflow.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "${{ env.TOOLS }}"

      - name: Redaktor – kontrola a verdikt
        if: steps.next.outputs.found == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Jsi agent blog-editor. Postupuj přesně podle .claude/agents/blog-editor.md.
            Článek: content/blog/${{ steps.next.outputs.slug }}.mdx,
            brief: workspace/serp/${{ steps.next.outputs.slug }}.md,
            posudek zapiš do workspace/reviews/${{ steps.next.outputs.slug }}.md.
            Měň jen content/blog/ a ./workspace. Necommituj, to udělá workflow.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "${{ env.TOOLS }}"

      - name: Verdikt redaktora
        id: verdict
        if: steps.next.outputs.found == 'true'
        run: |
          V=$(head -1 "workspace/reviews/${{ steps.next.outputs.slug }}.md" 2>/dev/null | sed -E 's/^VERDIKT:[[:space:]]*//' || true)
          echo "verdict=${V:-CHYBÍ}" >> "$GITHUB_OUTPUT"
          echo "Verdikt: ${V:-CHYBÍ}"

      - name: Autor – oprava podle posudku
        if: steps.next.outputs.found == 'true' && steps.verdict.outputs.verdict == 'VRÁCENO'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Redaktor vrátil článek content/blog/${{ steps.next.outputs.slug }}.mdx,
            posudek je ve workspace/reviews/${{ steps.next.outputs.slug }}.md.
            Přepracuj ho podle posudku a skillu blog-clanek (.claude/skills/blog-clanek/SKILL.md).
            Blog běží na autopilotu, majitele se nikdo ptát nebude: tvrzení, které nejde
            doložit z content/blog/_fakta.md, dat webu nebo ověřeného zdroje s odkazem,
            smaž nebo napiš bez čísla. Nic nevymýšlej. Když je článek slabší než
            konkurence, doplň chybějící části z briefu workspace/serp/${{ steps.next.outputs.slug }}.md.
            Spusť `npm run blog:check` a oprav všechny chyby, dokud neprojde.
            Měň jen soubory v content/blog/. Necommituj, PR vytvoří workflow.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "${{ env.TOOLS }}"

      - name: Redaktor – druhé čtení
        if: steps.next.outputs.found == 'true' && steps.verdict.outputs.verdict == 'VRÁCENO'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Jsi agent blog-editor. Postupuj přesně podle .claude/agents/blog-editor.md.
            Druhé čtení: autor článek content/blog/${{ steps.next.outputs.slug }}.mdx přepracoval
            podle tvého posudku ve workspace/reviews/${{ steps.next.outputs.slug }}.md.
            Zkontroluj ho znovu celý a posudek přepiš novým verdiktem (první řádek VERDIKT: ...).
            Měň jen content/blog/ a ./workspace. Necommituj, to udělá workflow.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "${{ env.TOOLS }}"

      - name: Kontrola článku
        if: steps.next.outputs.found == 'true'
        run: npm run blog:check

      - name: Uložit posudek do workspace
        if: steps.next.outputs.found == 'true'
        run: |
          cd workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "posudek: ${{ steps.next.outputs.slug }}"; git push; }

      - name: Otevřít PR a podle verdiktu sloučit
        if: steps.next.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.next.outputs.slug }}
          KEYWORD: ${{ steps.next.outputs.keyword }}
          BRANCH: ${{ steps.next.outputs.branch }}
          PUBLISH_AT: ${{ steps.next.outputs.publishAt }}
          AUTOMERGE: ${{ vars.BLOG_AUTOMERGE }}
        run: |
          FILE="content/blog/$SLUG.mdx"
          REVIEW="workspace/reviews/$SLUG.md"
          test -f "$FILE" || { echo "::error::Článek $FILE nevznikl"; exit 1; }
          TITLE=$(node -e "console.log(require('gray-matter').read(process.argv[1]).data.title)" "$FILE")
          WHEN=$(TZ=Europe/Prague date -d "$PUBLISH_AT" "+%-d. %-m. %Y v %H:%M")
          VERDICT=$(head -1 "$REVIEW" 2>/dev/null | sed -E 's/^VERDIKT:[[:space:]]*//' || true)
          [ -n "$VERDICT" ] || VERDICT="CHYBÍ"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add content/blog          # do PR jde jen blog, nic jiného
          git commit -m "blog: $TITLE"
          git push -u origin "$BRANCH"

          {
            echo "Článek na klíčové slovo **$KEYWORD**, vyjde **$WHEN** (pražského času)."
            echo
            echo "**Verdikt redaktora: $VERDICT**"
            echo
            if [ -f "$REVIEW" ]; then echo '<details><summary>Posudek</summary>'; echo; tail -n +2 "$REVIEW"; echo; echo '</details>'; echo; fi
            echo "Náhled je v odkazu od Vercelu níže. Na produkci se článek ukáže až v termínu."
            echo "Kontrola \`npm run blog:check\` prošla."
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create --base main --head "$BRANCH" \
            --title "Blog: $TITLE (vyjde $WHEN)" \
            --body-file "$RUNNER_TEMP/pr-body.md"

          if [ "$AUTOMERGE" = "true" ] && [ "$VERDICT" = "SCHVÁLENO" ]; then
            for i in 1 2 3 4 5 6; do
              gh pr merge "$BRANCH" --squash --delete-branch && exit 0
              sleep 10
            done
            echo "::error::PR se nepodařilo sloučit"; exit 1
          fi
          echo "PR zůstává otevřený ke kontrole (verdikt: $VERDICT, autopilot: ${AUTOMERGE:-vypnutý})."
