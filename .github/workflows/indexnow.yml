name: IndexNow

# Po každém úspěšném produkčním nasazení na Vercelu oznámí Bingu, Seznamu
# a dalším vyhledávačům stránky, kterým se v sitemapě změnilo lastmod.
# Stav (co už bylo oznámeno) drží cache, takže se nic neposílá dvakrát.
# Ručně: Actions → IndexNow → Run workflow (volitelně konkrétní URL).

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL oddělené mezerou (prázdné = změny ze sitemapy)"
        required: false
        default: ""
      days:
        description: "Okno lastmod ve dnech (3650 = jednorázově celý web)"
        required: false
        default: "7"

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Načíst stav
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Oznámit změny
        env:
          URLS: ${{ inputs.urls }}
          DAYS: ${{ inputs.days || '7' }}
        run: node scripts/indexnow.mjs --state .indexnow-state.json --days "$DAYS" $URLS

      - name: Uložit stav
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
