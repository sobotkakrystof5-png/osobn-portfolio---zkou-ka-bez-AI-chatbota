name: Blog – vydat článek

# Pojistka k vydání v neděli, ve středu a v pátek ve 14:00 (Praha). Samotný
# článek se na blogu, v sitemapě, RSS a llms.txt ukáže sám: stránky se obnovují
# každých 5 minut (revalidate), takže na tomhle cronu nezávisí. GitHub cron
# umí zpozdit i o hodiny (23. 11. 2026 skoro o 10 h).
# Tenhle workflow po vydání spustí nové nasazení: obnoví oborové stránky
# (blok Články k tématu) a nasazení spustí IndexNow (Bing, Seznam a další).
#
# 12:00 UTC = 14:00 v létě, 13:00 UTC = 14:00 v zimě. Nasazuje se jen tehdy,
# když termín článku prošel a od té doby nasazení neproběhlo, takže druhý běh
# nic nezdvojí.
#
# Secret VERCEL_DEPLOY_HOOK_URL: Vercel → Project → Settings → Git →
# Deploy Hooks → větev main.

on:
  schedule:
    - cron: "0 12 * * 0,3,5"
    - cron: "0 13 * * 0,3,5"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Je co vydat?
        id: due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE=$(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=1" --jq '.[0].created_at // ""')
          echo "Poslední produkční nasazení: ${SINCE:-žádné}"
          node scripts/blog-queue.mjs due --since "$SINCE"

      - name: Spustit nasazení
        if: steps.due.outputs.due == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          SLUGS: ${{ steps.due.outputs.slugs }}
        run: |
          test -n "$HOOK" || { echo "::error::Chybí secret VERCEL_DEPLOY_HOOK_URL"; exit 1; }
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Nasazení spuštěno, vychází: $SLUGS"
